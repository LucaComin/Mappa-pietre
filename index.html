<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Interattiva delle Pietre</title>
    <meta name="description" content="Esplora la storia e i movimenti delle pietre attraverso una mappa interattiva moderna e coinvolgente">
    
    <!-- Preconnect per performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">

    <!-- Leaflet core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- MarkerCluster plugin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Caricamento mappa...</p>
        </div>
    </div>

    <div class="container">
        <!-- Intestazione e controlli migliorati -->
        <header>
            <div class="header-content">
                <h1>
                    <span class="header-icon">🗺️</span>
                    Mappa delle Pietre
                </h1>
                <p class="header-subtitle">Esplora la storia attraverso il tempo</p>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="language-select">
                        <span class="control-icon">🌐</span>
                        Seleziona lingua:
                    </label>
                    <div class="custom-select">
                        <select id="language-select" aria-label="Seleziona la lingua dell'interfaccia" onchange="changeLanguage(this.value)">
                            <option value="it">Italiano</option>
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                            <option value="fr">Français</option>
                            <option value="ru">Русский</option>
                            <option value="ar">العربية</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="pl">Polski</option>
                            <option value="pt">Português</option>
                            <option value="ja">日本語</option>
                        </select>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="stone-select">
                        <span class="control-icon">🪨</span>
                        Seleziona una pietra:
                    </label>
                    <div class="custom-select">
                        <select id="stone-select" aria-label="Seleziona una pietra da visualizzare">
                            <option value="all">Mostra tutte</option>
                        </select>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="image-display-select">
                        <span class="control-icon">📸</span>
                        Mostra immagini:
                    </label>
                    <div class="custom-select">
                        <select id="image-display-select" aria-label="Seleziona modalità visualizzazione immagini">
                            <option value="last">Ultima</option>
                            <option value="none">Nessuna</option>
                            <option value="all">Tutte</option>
                        </select>
                    </div>
                </div>
                
                <div class="control-group">
                    <button id="find-stone-btn" class="find-stone-button" aria-label="Trova la mia pietra">
                        <span class="control-icon">🔍</span>
                        Trova la mia pietra
                    </button>
                </div>
                
                <div class="control-group">
                    <button id="help-btn" class="help-button" aria-label="Mostra guida">
                        <span class="control-icon">❓</span>
                        Guida
                    </button>
                </div>
            </div>
        </header>

        <!-- Mappa principale -->
        <main>
            <div id="map" class="map-container" aria-label="Mappa interattiva delle pietre"></div>
        </main>

        <!-- Pannello laterale per la storia della pietra -->
        <aside id="stone-history-panel" class="stone-history-panel hidden">
            <div class="panel-header">
                <h2 id="stone-title">Storia della Pietra</h2>
                <button id="close-history" class="close-btn" aria-label="Chiudi pannello storia">✕</button>
            </div>
            
            <div class="panel-content">
                <div id="stone-info" class="stone-info">
                    <!-- Contenuto dinamico -->
                </div>
                
                <div class="mini-map-container">
                    <h3>Percorso della pietra</h3>
                    <div id="mini-map" class="mini-map"></div>
                </div>
                
                <div class="timeline-controls">
                    <button id="play-timeline" class="timeline-btn">
                        <span class="btn-icon">▶️</span>
                        Riproduci percorso
                    </button>
                    <div class="speed-control">
                        <label for="speed-slider">Velocità:</label>
                        <input type="range" id="speed-slider" min="500" max="5000" value="2000" step="500">
                        <span id="speed-display">2s</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal per cattura foto -->
    <div id="photo-capture-modal" class="modal hidden">
        <div class="modal-content photo-modal">
            <div class="modal-header">
                <h2>Trova la tua pietra</h2>
                <button id="close-photo-modal" class="close-btn">✕</button>
            </div>
            
            <div class="modal-body">
                <!-- Opzioni iniziali -->
                <div class="photo-options">
                    <div class="option-card">
                        <button id="camera-btn" class="option-btn">
                            <span class="option-icon">📷</span>
                            <span class="option-text">Scatta una foto</span>
                        </button>
                    </div>
                    <div class="option-card">
                        <button id="gallery-btn" class="option-btn">
                            <span class="option-icon">🖼️</span>
                            <span class="option-text">Seleziona dalla galleria</span>
                        </button>
                    </div>
                </div>
                
                <!-- Container fotocamera -->
                <div id="camera-container" class="camera-container hidden">
                    <video id="camera-video" autoplay playsinline></video>
                    <canvas id="camera-canvas" style="display: none;"></canvas>
                    <div class="camera-controls">
                        <button id="capture-btn" class="capture-btn">
                            <span class="btn-icon">📸</span>
                            Cattura
                        </button>
                        <button id="cancel-camera-btn" class="cancel-btn">
                            <span class="btn-icon">❌</span>
                            Annulla
                        </button>
                    </div>
                </div>
                
                <!-- Anteprima immagine -->
                <div id="image-preview-container" class="image-preview-container hidden">
                    <div class="preview-image-wrapper">
                        <img id="preview-image" alt="Anteprima immagine selezionata">
                    </div>
                    <div class="preview-controls">
                        <button id="analyze-btn" class="analyze-btn">
                            <span class="btn-icon">🔍</span>
                            Analizza foto
                        </button>
                        <button id="retake-btn" class="retake-btn">
                            <span class="btn-icon">🔄</span>
                            Riprova
                        </button>
                    </div>
                </div>
                
                <!-- Risultati analisi -->
                <div id="analysis-results" class="analysis-results hidden">
                    <!-- Contenuto dinamico -->
                </div>
            </div>
        </div>
        
        <!-- Input file nascosto -->
        <input type="file" id="file-input" accept="image/*" style="display: none;">
    </div>

    <!-- Modal fullscreen per immagini -->
    <div id="fullscreen-modal" class="fullscreen-modal hidden">
        <div class="fullscreen-content">
            <button id="close-fullscreen" class="close-fullscreen-btn">✕</button>
            <img id="fullscreen-image" alt="Immagine a schermo intero">
            <div class="fullscreen-info">
                <h3 id="fullscreen-title"></h3>
                <p id="fullscreen-date"></p>
            </div>
        </div>
    </div>

    <!-- Sistema di notifiche -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Scripts -->
    <!-- OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
    
    <!-- Leaflet core -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- MarkerCluster plugin -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Gradio Client -->
    <script src="https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js"></script>

    <script type="text/javascript">
        // Variabili globali per il client Gradio e il token
        window.gradioClient = null;
        window.hf_token = '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'; // Token aggiornato fornito dall'utente
        window.gradioSpaceUrl = 'llllluuuuucccccaaaaa/AnalisiPietre'; // L'URL del tuo spazio Hugging Face
        window.gradioConnectionStatus = 'disconnected'; // Stato della connessione

        // Funzione per inizializzare il client Gradio con gestione errori migliorata
        async function initializeGradioClient() {
            try {
                console.log('Tentativo di connessione al servizio Gradio...');
                window.gradioConnectionStatus = 'connecting';
                
                // Test di connettività di base
                const testResponse = await fetch(`https://huggingface.co/spaces/${window.gradioSpaceUrl}`, {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                
                // Connessione al client Gradio con timeout
                const connectionPromise = GradioClient.Client.connect(window.gradioSpaceUrl, { 
                    hf_token: window.hf_token 
                });
                
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('CONNECTION_TIMEOUT')), 15000)
                );
                
                window.gradioClient = await Promise.race([connectionPromise, timeoutPromise]);
                window.gradioConnectionStatus = 'connected';
                
                console.log('✅ Gradio Client connesso con successo allo spazio:', window.gradioSpaceUrl);
                
                // Notifica di successo
                if (window.notificationSystem) {
                    window.notificationSystem.success('Servizio di riconoscimento pietre attivo', 3000);
                }
                
            } catch (error) {
                window.gradioConnectionStatus = 'error';
                console.error('❌ Errore nella connessione al Gradio Client:', error);
                
                // Gestione specifica degli errori
                let errorMessage = '';
                let errorType = '';
                
                if (error.message === 'CONNECTION_TIMEOUT') {
                    errorType = 'TIMEOUT';
                    errorMessage = 'Timeout nella connessione al servizio di analisi';
                } else if (error.message.includes('401') || error.message.includes('Unauthorized')) {
                    errorType = 'AUTH_ERROR';
                    errorMessage = 'Token di autenticazione non valido';
                } else if (error.message.includes('404') || error.message.includes('Not Found')) {
                    errorType = 'SPACE_NOT_FOUND';
                    errorMessage = 'Spazio Hugging Face non trovato';
                } else if (error.message.includes('fetch') || error.message.includes('network')) {
                    errorType = 'NETWORK_ERROR';
                    errorMessage = 'Errore di connessione di rete';
                } else {
                    errorType = 'UNKNOWN_ERROR';
                    errorMessage = 'Errore sconosciuto nella connessione';
                }
                
                // Salva informazioni sull'errore per uso futuro
                window.gradioConnectionError = {
                    type: errorType,
                    message: errorMessage,
                    originalError: error
                };
                
                // Notifica di errore
                if (window.notificationSystem) {
                    window.notificationSystem.error(
                        `Servizio di riconoscimento non disponibile: ${errorMessage}`, 
                        5000
                    );
                }
            }
        }

        // Funzione per verificare lo stato della connessione
        function checkGradioConnection() {
            return {
                isConnected: window.gradioConnectionStatus === 'connected',
                status: window.gradioConnectionStatus,
                client: window.gradioClient,
                error: window.gradioConnectionError || null
            };
        }

        // Funzione per ottenere un messaggio di errore dettagliato
        function getDetailedErrorMessage(errorType) {
            const errorMessages = {
                'GRADIO_NOT_INITIALIZED': {
                    icon: '🔄',
                    title: 'Servizio non inizializzato',
                    message: 'Il servizio di analisi non è ancora pronto. Ricarica la pagina e riprova.',
                    suggestion: 'Verifica la tua connessione internet e ricarica la pagina.'
                },
                'AUTH_ERROR': {
                    icon: '🔐',
                    title: 'Errore di autenticazione',
                    message: 'Token di accesso non valido o scaduto.',
                    suggestion: 'Contatta l\'amministratore per aggiornare il token di accesso.'
                },
                'SPACE_NOT_FOUND': {
                    icon: '🔍',
                    title: 'Servizio non trovato',
                    message: 'Lo spazio Hugging Face non è stato trovato o non è accessibile.',
                    suggestion: 'Verifica che lo spazio sia pubblico e accessibile.'
                },
                'NETWORK_ERROR': {
                    icon: '🌐',
                    title: 'Errore di rete',
                    message: 'Impossibile raggiungere il servizio di analisi.',
                    suggestion: 'Verifica la tua connessione internet e riprova.'
                },
                'TIMEOUT': {
                    icon: '⏱️',
                    title: 'Timeout della connessione',
                    message: 'Il servizio sta impiegando troppo tempo a rispondere.',
                    suggestion: 'Il servizio potrebbe essere sovraccarico. Riprova tra qualche minuto.'
                },
                'SERVICE_UNREACHABLE': {
                    icon: '🚫',
                    title: 'Servizio non raggiungibile',
                    message: 'Il servizio di analisi non è attualmente disponibile.',
                    suggestion: 'Il servizio potrebbe essere in manutenzione. Riprova più tardi.'
                },
                'NO_STONES_DETECTED': {
                    icon: '🔍',
                    title: 'Nessuna pietra rilevata',
                    message: 'Non sono state riconosciute pietre nell\'immagine fornita.',
                    suggestion: 'Prova con una foto più chiara o da un\'angolazione diversa.'
                },
                'SERVICE_ERROR': {
                    icon: '⚠️',
                    title: 'Errore del servizio',
                    message: 'Si è verificato un errore interno nel servizio di analisi.',
                    suggestion: 'Riprova tra qualche minuto. Se il problema persiste, contatta il supporto.'
                },
                'UNKNOWN_ERROR': {
                    icon: '❌',
                    title: 'Errore sconosciuto',
                    message: 'Si è verificato un errore imprevisto.',
                    suggestion: 'Riprova o contatta il supporto se il problema persiste.'
                }
            };
            
            return errorMessages[errorType] || errorMessages['UNKNOWN_ERROR'];
        }

        // Esporta funzioni per uso globale
        window.checkGradioConnection = checkGradioConnection;
        window.getDetailedErrorMessage = getDetailedErrorMessage;

        // Inizializza il client Gradio quando il DOM è pronto
        document.addEventListener('DOMContentLoaded', () => {
            // Ritarda l'inizializzazione per permettere il caricamento completo
            setTimeout(() => {
                initializeGradioClient();
            }, 1000);
        });
    </script>

    <!-- Translations -->
    <script src="translations.js"></script>
    
    <!-- Notification system -->
    <script src="notifications.js"></script>
    
    <!-- Image downloader -->
    <script src="image-downloader.js"></script>
    
    <!-- Image recognition functionality -->
    <script src="image-recognition.js"></script>
    
    <!-- Photo capture system -->
    <script src="photo-capture.js"></script>
    
    <!-- Photo recognition system -->
    <script src="photo-recognition.js"></script>
    
    <!-- Status indicator -->
    <script src="status-indicator.js"></script>
    
    <!-- System initializer -->
    <script src="system-initializer.js"></script>
    
    <!-- Tutorial system -->
    <script src="tutorial.js"></script>
    
    <!-- Main application script -->
    <script src="script.js"></script>
</body>
</html>
