<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Interattiva delle Pietre</title>
    <meta name="description" content="Esplora la storia e i movimenti delle pietre attraverso una mappa interattiva moderna e coinvolgente">

    <!-- Preconnect per performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">

    <!-- Leaflet core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- MarkerCluster plugin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Caricamento mappa...</p>
        </div>
    </div>

    <div class="container">
        <!-- Intestazione e controlli migliorati -->
        <header>
            <div class="header-content">
                <h1>
                    <span class="header-icon">🗺️</span>
                    Mappa delle Pietre
                </h1>
                <p class="header-subtitle">Esplora la storia attraverso il tempo</p>
                <div class="header-nav">
                    <a href="about.html" id="about-us-link" class="nav-link">Chi Siamo</a>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="language-selector">
                    <span class="control-icon">🌐</span>
                    Seleziona lingua:
                </label>
                <div class="custom-select">
                    <select id="language-selector" aria-label="Seleziona la lingua dell'interfaccia" onchange="changeLanguage(this.value)">
                        <option value="it">Italiano</option>
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                        <option value="fr">Français</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                        <option value="pl">Polski</option>
                        <option value="pt">Português</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="stone-selector">
                    <span class="control-icon">🪨</span>
                    Seleziona una pietra:
                </label>
                <div class="custom-select">
                    <select id="stone-selector" aria-label="Seleziona una pietra specifica da visualizzare">
                        <option value="Mostra tutte">Mostra tutte</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="show-images-selector">
                    <span class="control-icon">📸</span>
                    Mostra immagini:
                </label>
                <div class="custom-select">
                    <select id="show-images-selector" aria-label="Controlla la visualizzazione delle immagini">
                        <option value="Last">Ultima</option>
                        <option value="None">Nessuna</option>
                        <option value="All">Tutte</option>
                    </select>
                </div>
            </div>

            <!-- Controlli di riproduzione -->
            <div class="playback-controls">
                <button id="prev-button" class="control-btn" aria-label="Pietra precedente">
                    <span class="btn-icon">⏮️</span>
                </button>
                <button id="play-button" class="control-btn" aria-label="Avvia riproduzione automatica">
                    <span class="btn-icon">▶️</span>
                </button>
                <button id="pause-button" class="control-btn" style="display: none;" aria-label="Pausa riproduzione automatica">
                    <span class="btn-icon">⏸️</span>
                </button>
                <button id="next-button" class="control-btn" aria-label="Pietra successiva">
                    <span class="btn-icon">⏭️</span>
                </button>
            </div>
        </div>

        <!-- Mappa principale -->
        <div id="map" class="map-container" role="application" aria-label="Mappa interattiva delle pietre"></div>

        <!-- Pulsante di aiuto -->
        <button id="help-button" class="help-button" aria-label="Mostra guida interattiva">
            <span class="help-icon">?</span>
        </button>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js"></script>
    <script src="translations.js"></script>
    <script src="script_modified.js"></script>
    <script src="sw.js"></script>
</body>
</html>
