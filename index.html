<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Interattiva delle Pietre - Versione Modificata</title>
    <meta name="description" content="Esplora la storia e i movimenti delle pietre attraverso una mappa interattiva moderna e coinvolgente">
    
    <!-- Preconnect per performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">

    <!-- Leaflet core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- MarkerCluster plugin (non utilizzato nella versione modificata) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

    <!-- Custom CSS -->
    <style>
        /* CSS base per il test */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header-content h1 {
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 500;
            color: #374151;
            font-size: 0.9rem;
        }

        select {
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #map {
            height: 600px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Stili per i popup personalizzati */
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .custom-popup .leaflet-popup-tip {
            background: white;
        }

        /* Pannello storia (nascosto per il test base) */
        #history-panel {
            display: none;
        }

        /* Stili per i marcatori personalizzati */
        .custom-marker {
            transition: all 0.3s ease;
        }

        .custom-marker:hover {
            transform: scale(1.1);
        }

        .custom-image-marker {
            transition: all 0.3s ease;
        }

        .custom-image-marker:hover {
            transform: scale(1.1);
        }
    </style>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Caricamento mappa...</p>
        </div>
    </div>

    <div class="container">
        <!-- Intestazione e controlli -->
        <header>
            <div class="header-content">
                <h1>
                    <span class="header-icon">🗺️</span>
                    Mappa delle Pietre - Versione Modificata
                </h1>
                <p class="header-subtitle">Versione senza clustering e senza orari</p>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="language-select">🌐 Lingua:</label>
                    <select id="language-select">
                        <option value="it">Italiano</option>
                        <option value="en">English</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="stone-select">🪨 Seleziona una pietra:</label>
                    <select id="stone-select">
                        <option value="all">Mostra tutte</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="image-display-select">📸 Mostra immagini:</label>
                    <select id="image-display-select">
                        <option value="last">Ultima</option>
                        <option value="none">Nessuna</option>
                        <option value="all">Tutte</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Mappa principale -->
        <div id="map"></div>
    </div>

    <!-- Pannello storia (semplificato per il test) -->
    <div id="history-panel" class="hidden">
        <div id="history-title"></div>
        <img id="history-image" style="max-width: 100%; height: auto;">
        <div id="history-image-caption"></div>
        <div id="image-counter"></div>
        <div id="timeline-current-date"></div>
        <div id="timeline"></div>
        <button id="prev-button">Precedente</button>
        <button id="next-button">Successivo</button>
        <button id="close-history">Chiudi</button>
        <div id="mini-map" style="height: 200px; width: 100%;"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- MarkerCluster plugin (caricato ma non utilizzato nella versione modificata) -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Script modificato -->
    <script src="script_modified.js"></script>
</body>
</html>
