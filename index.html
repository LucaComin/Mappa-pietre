<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Interattiva delle Pietre</title>
    <meta name="description" content="Esplora la storia e i movimenti delle pietre attraverso una mappa interattiva.">
    
    <!-- Preconnect per performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">

    <!-- Leaflet core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmk7wQDKT1zLzJ/a7L9/8Wc94/i2h+" crossorigin=""/>

    <!-- MarkerCluster plugin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' font-size='90' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%97%B5%3C/text%3E%3C/svg%3E" type="image/svg+xml">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Caricamento mappa...</p>
        </div>
    </div>

    <div class="container">
        <!-- Intestazione e controlli migliorati -->
        <header>
            <div class="header-content">
                <h1>
                    <span class="header-icon">🗺️</span>
                    Mappa delle Pietre
                </h1>
                <p class="header-subtitle">Esplora la storia attraverso il tempo</p>
                <nav class="header-nav">
                    <a href="about.html" id="about-us-link" class="nav-link">Chi Siamo</a>
                </nav>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="language-select">
                        <span class="control-icon">🌐</span>
                        Seleziona lingua:
                    </label>
                    <select id="language-select" class="custom-select" aria-label="Seleziona la lingua dell'interfaccia" onchange="changeLanguage(this.value)">
                        <option value="it">Italiano</option>
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                        <option value="fr">Français</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                        <option value="pl">Polski</option>
                        <option value="pt">Português</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="stone-select">
                        <span class="control-icon">🪨</span>
                        Seleziona una pietra:
                    </label>
                    <select id="stone-select" class="custom-select" aria-label="Seleziona una pietra da visualizzare">
                        <option value="moved_stones">Pietre con spostamenti</option> <!-- NUOVA OPZIONE -->
                        <option value="all">Mostra tutte</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="image-display-select">
                        <span class="control-icon">📸</span>
                        Mostra immagini:
                    </label>
                    <select id="image-display-select" class="custom-select" aria-label="Seleziona modalità visualizzazione immagini">
                        <option value="last">Ultima</option>
                        <option value="none">Nessuna</option>
                        <option value="all">Tutte</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Contenitore principale per la mappa -->
        <main id="map" role="main" aria-label="Mappa interattiva delle pietre"></main>

        <!-- Pannello della Storia migliorato -->
        <div id="history-panel" class="history-panel hidden" role="dialog" aria-labelledby="history-title" aria-modal="true">
            <button id="close-history-btn" class="close-button" aria-label="Chiudi pannello storia" title="Chiudi">
                ✕
            </button>
            <div class="history-content">
                <h2 id="history-title">Storia della Pietra</h2>
                <div id="history-map-container" class="history-map-container">
                    <div id="mini-map" class="mini-map"></div>
                </div>
                <div id="history-details" class="history-details">
                    <!-- Dettagli dinamici verranno inseriti qui -->
                </div>
            </div>
        </div>

        <!-- Modale per la foto -->
        <div id="photo-modal" class="modal hidden" role="dialog" aria-labelledby="photo-modal-title" aria-modal="true">
            <div class="modal-content">
                <h2 id="photo-modal-title">Aggiungi Foto</h2>
                <button id="close-photo-modal-btn" class="close-button" aria-label="Chiudi modale foto" title="Chiudi">✕</button>
                <div id="photo-upload-controls">
                    <button id="take-photo-btn">📷 Scatta Foto</button>
                    <button id="upload-photo-btn">📁 Carica Foto</button>
                    <input type="file" id="photo-file-input" accept="image/*" style="display: none;">
                </div>
                <div id="photo-preview-container" class="photo-preview-container hidden">
                    <img id="photo-preview" class="photo-preview" alt="Anteprima foto">
                    <input type="text" id="photo-description-input" placeholder="Descrizione (opzionale)">
                    <div class="photo-actions">
                        <button id="capture-btn">📸 Scatta</button>
                        <button id="cancel-capture-btn">✕ Annulla</button>
                    </div>
                </div>
                <div id="photo-analysis-container" class="photo-analysis-container hidden">
                    <button id="analyze-photo-btn">🔍 Analizza</button>
                    <button id="retry-analysis-btn">🔄 Riprova</button>
                    <div id="analysis-results" class="analysis-results">
                        <!-- Risultati dell'analisi verranno inseriti qui -->
                    </div>
                    <button id="view-on-map-btn">🗺️ Visualizza sulla Mappa</button>
                </div>
            </div>
        </div>

        <!-- Modale per il tutorial -->
        <div id="tutorial-modal" class="modal hidden" role="dialog" aria-labelledby="tutorial-modal-title" aria-modal="true">
            <div class="modal-content">
                <h2 id="tutorial-modal-title" class="tutorial-title">Benvenuto nella Mappa delle Pietre!</h2>
                <button id="close-tutorial-btn" class="close-button" aria-label="Chiudi tutorial" title="Chiudi">✕</button>
                <div id="tutorial-content" class="tutorial-content">
                    <!-- Contenuto dinamico del tutorial -->
                </div>
                <div class="tutorial-navigation">
                    <button id="tutorial-prev-btn" class="tutorial-button" disabled>Previous</button>
                    <button id="tutorial-skip-btn" class="tutorial-button">Skip</button>
                    <button id="tutorial-next-btn" class="tutorial-button">Next</button>
                </div>
            </div>
        </div>

        <!-- Pulsante per aprire il tutorial -->
        <button id="open-tutorial-btn" class="floating-button" aria-label="Apri tutorial">?</button>

        <!-- Pulsante per aprire la modale foto -->
        <button id="open-photo-modal-btn" class="floating-button photo-button" aria-label="Aggiungi foto">🔍</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20n63BAzQzTzW4yT9+bI9/J4K1Fw9d9+xW4/i2h+" crossorigin=""></script>

    <!-- MarkerCluster plugin JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Script principale dell'applicazione -->
    <script src="translations.js"></script>
    <script src="script_fixed.js"></script>
</body>
</html>
